name: APK derle

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew test --stacktrace

      - name: Debug APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'yı adlandır
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/taksi-oto-kabul.apk

      - name: APK'yı artefakt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: taksi-oto-kabul-apk
          path: dist/taksi-oto-kabul.apk
          if-no-files-found: error

      # Telefondan doğrudan indirilebilsin diye sürüm olarak da yayınla.
      # Artefakt indirmek GitHub oturumu ve zip açmayı gerektiriyor; sürüm dosyası gerektirmiyor.
      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Taksi Oto Kabul - son APK
          body: |
            Telefona kurulabilir APK (debug imzalı).

            Kurulum:
            1. Aşağıdaki `taksi-oto-kabul.apk` dosyasını telefonunuzdan indirin.
            2. Telefon "bilinmeyen kaynak" uyarısı verirse tarayıcıya kurulum izni verin.
            3. Kurduktan sonra uygulamayı açın ve README'deki ilk ayar adımlarını izleyin.

            Uygulama deneme modu açık gelir: kuralları doğrulayana kadar
            hiçbir düğmeye basmaz, sadece kayıt tutar.
          files: dist/taksi-oto-kabul.apk
          make_latest: true

      - name: Test raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/
          if-no-files-found: ignore
